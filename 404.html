<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 | Glome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f172a;
            --accent: #22c55e;
            --bg: #f8fafc;
            --card: #ffffff;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37,99,235,0.12), transparent 55%),
                radial-gradient(circle at bottom right, rgba(34,197,94,0.12), transparent 55%),
                var(--bg);
            color: var(--secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            max-width: 960px;
            width: 100%;
            background: var(--card);
            border-radius: 28px;
            padding: 80px 50px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(15,23,42,0.15);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent 40%, rgba(37,99,235,0.05), transparent 70%);
            pointer-events: none;
        }

        h1 {
            font-size: 120px;
            margin: 0;
            color: var(--primary);
            line-height: 1;
        }

        h2 {
            font-size: 36px;
            margin: 20px 0 10px;
        }

        p {
            font-size: 18px;
            color: var(--muted);
            max-width: 650px;
            margin: 0 auto 45px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #1e40af;
        }

        .btn-outline {
            border: 2px solid var(--accent);
            color: var(--accent);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--accent);
            color: #052e16;
        }

        .footer {
            margin-top: 70px;
            font-size: 14px;
            color: var(--muted);
        }

        .footer span {
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 84px;
            }
            h2 {
                font-size: 28px;
            }
            .card {
                padding: 55px 28px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
        The page you’re trying to access doesn’t exist or has been moved.
        Let’s take you back to something purposeful and well-crafted.
    </p>

    <div class="actions">
        <a href="index.html" class="btn btn-primary">🏠 Go to Homepage</a>
        <a href="index.html#services" class="btn btn-outline">💡 View Our Services</a>
    </div>

    <div class="footer">
        © 2026 <span>Glome</span> · Design · Technology · Digital Innovation
    </div>
</div>

</body>
</html>
